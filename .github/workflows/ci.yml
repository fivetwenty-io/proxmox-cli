name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push to the same PR/branch has nothing left to prove, and the
# single self-hosted runner serializes jobs — cancel the stale run instead of
# queueing behind it. Tag pushes never share a group here (release.yml owns
# those), so nothing release-critical can be cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs rather than tags: on a self-hosted runner
# a retagged or compromised action executes inside the home network, so the
# tag's mutability is the attack surface. Dependabot keeps the pins current.
jobs:
  check:
    name: check
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: true
          # Off on purpose: these jobs run on the host (not in a container),
          # so ~/go/pkg/mod and ~/.cache/go-build already survive between
          # jobs on the persistent self-hosted runner. The Actions cache
          # would haul a multi-GB tarball over the lab link to restore what
          # is already on disk, then untar it over Go's read-only module
          # cache -- thousands of tar "Cannot open: File exists" lines and
          # minutes of wall clock for no gain. Local disk is the cache.
          cache: false

      - name: gofmt
        run: make fmt-check

      - name: Vet
        run: make vet

      # The action only installs the pinned golangci-lint; the make target
      # runs it, so CI and a local `make lint-check` execute the same command.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          install-only: true

      - name: Lint
        run: make lint-check

      - name: Unit tests
        run: make test-go

      # The race detector is the only gate that catches concurrent misuse of
      # the signal-relay and log-writer paths, and the repo already ships a
      # make target for it that CI never invoked.
      - name: Unit tests (race detector)
        env:
          # The self-hosted runner's Go defaults cgo off; -race requires it.
          CGO_ENABLED: "1"
        run: make test-go-race

      # This job runs on Linux, so every //go:build darwin file — notably
      # internal/config/secrets_keychain_darwin.go, the entire macOS keychain
      # credential backend — is excluded from the build and from every check
      # above it. A compile error or a vet failure in that backend would
      # otherwise reach a release before anything noticed. Cross-compiling
      # costs seconds and needs no macOS runner.
      - name: Build and vet the darwin-only code paths
        run: make check-darwin

      - name: Man generation smoke
        run: make check-docs

      # The release workflow injects the Homebrew install steps into the cask
      # GoReleaser generates, anchored on that cask's `binary` stanza. If the
      # anchor or the stanzas ever stop matching, the failure belongs here and
      # not in the middle of a release.
      - name: Cask install steps
        run: make check-cask-steps

      # docs/test-coverage-matrix.md is generated from the built command tree
      # and the e2e tree definitions, so a new leaf that nobody classified
      # silently makes it stale. Regenerating here catches that at review time.
      - name: Coverage matrix up to date
        run: make check-coverage-matrix

  # Commit messages here never carry AI attribution. The check reads every
  # commit reachable from the tip, so it needs the full history, and it runs
  # as its own job so a failure is named for what it is.
  attribution:
    name: attribution
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: No AI attribution in commit messages
        run: make check-commit-attribution

  security:
    name: security
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: true
          # Off on purpose: these jobs run on the host (not in a container),
          # so ~/go/pkg/mod and ~/.cache/go-build already survive between
          # jobs on the persistent self-hosted runner. The Actions cache
          # would haul a multi-GB tarball over the lab link to restore what
          # is already on disk, then untar it over Go's read-only module
          # cache -- thousands of tar "Cannot open: File exists" lines and
          # minutes of wall clock for no gain. Local disk is the cache.
          cache: false

      # Reachability-aware CVE scan of the module graph against the Go vuln
      # database; unlike trivy below it only fails on vulnerabilities in code
      # paths this binary actually calls.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          make govulncheck

      # Dependency CVEs (go.mod/go.sum), committed secrets, and workflow
      # misconfigurations. Fails the build on anything it finds — triage by
      # fixing or by a reviewed .trivyignore entry, never by loosening this.
      #
      # The scan options live in `make trivy`, so CI and a local run execute
      # the same command. setup-trivy is the action trivy-action itself uses
      # to install the binary, pinned to the same commit and to the Trivy
      # version that trivy-action v0.36.0 defaults to.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0

      - name: Trivy scan
        run: make trivy
